# Static site — Netlify also installs the MQTT proxy function's deps.
[build]
  publish = "."
  command = "cd netlify/functions && npm install"
  functions = "netlify/functions"

# SPA-style fallback: any unknown path returns the dashboard (index.html).
# Functions matched first via the explicit /api/* rewrite below.
[[redirects]]
  from = "/api/iot-values"
  to = "/.netlify/functions/iot-values"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Don't aggressively cache the entry document or seed data — the
# ?v= cache-buster on script tags handles JS/CSS, but the HTML
# itself must always be fresh so new ?v= values are seen.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
