name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any older runs for the same branch — only the latest push matters.
concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Opt actions into Node.js 24 ahead of GitHub's June 2026 default switch.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@26

      - name: Link Netlify project
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: netlify link --id f6a345b0-0510-4c2e-812a-983b3d02a966

      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          netlify deploy \
            --prod \
            --no-build \
            --dir . \
            --message "GitHub Actions ${{ github.sha }}"
