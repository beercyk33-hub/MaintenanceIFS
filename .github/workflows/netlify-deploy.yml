name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any older runs for the same branch — only the latest push matters.
concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@26

      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: f6a345b0-0510-4c2e-812a-983b3d02a966
        run: |
          netlify deploy \
            --prod \
            --no-build \
            --dir . \
            --site maintenance-ifs \
            --message "GitHub Actions ${{ github.sha }}"
